name: LINE daily life tips

# 15分おきに /api/cron/line-daily-tips を叩く。06:00/09:00/12:00/15:00/18:00/21:00/23:00/23:30(JST)の
# うち、予定時刻を過ぎていてまだ送っていないtipsが生成・送信される（サーバー側で時刻判定・冪等性
# チェックを行う）。GitHubのscheduleは設定通りには発火しないため、起動の機会を増やす目的で
# line-daily-tips-2.yml が同じエンドポイントをずらした時刻で叩いている。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check and send due LINE daily tips
        run: |
          curl -sS -f --max-time 90 -X GET "${{ vars.APP_BASE_URL || 'https://house-wheat-nine.vercel.app' }}/api/cron/line-daily-tips" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
